name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    # Postgres para los tests de integración (backend/tests/integration).
    # Mismas credenciales que docker-compose.yml; la BD se llama *_test
    # porque los tests la vacían (guarda en tests/integration/helpers/test-db-url.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homefix
          POSTGRES_PASSWORD: homefix
          POSTGRES_DB: homefix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homefix -d homefix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration tests (Postgres)
        run: pnpm --filter backend test:integration
        env:
          TEST_DATABASE_URL: postgresql://homefix:homefix@localhost:5432/homefix_test?schema=public

      - name: Build
        run: pnpm build
